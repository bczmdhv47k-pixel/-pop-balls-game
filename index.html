<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pop Balls 🎈</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #111827, #1e3a8a);
    color: white;
    height: 100vh;
}

#game {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

#top {
    position: absolute;
    top: 15px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-around;
    z-index: 10;
    font-size: 20px;
    font-weight: bold;
}

.ball {
    position: absolute;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    cursor: pointer;

    background:
        radial-gradient(
            circle at 30% 25%,
            rgba(255,255,255,0.95) 0%,
            rgba(255,255,255,0.45) 8%,
            transparent 20%
        ),
        linear-gradient(
            135deg,
            var(--ball-light),
            var(--ball-color) 55%,
            var(--ball-dark)
        );

    box-shadow:
        inset -8px -10px 15px rgba(0,0,0,0.22),
        inset 8px 8px 12px rgba(255,255,255,0.35),
        0 0 12px var(--ball-glow),
        0 6px 18px rgba(0,0,0,0.35);

    animation: ballFloat 1.2s ease-in-out infinite alternate;

    transform-origin: center;
}
.golden {
    background:
        radial-gradient(
            circle at 30% 25%,
            #fff8b0 0%,
            #ffd700 18%,
            #ffb300 55%,
            #d88900 100%
        ) !important;

    color: #5c3b00 !important;

    box-shadow:
        inset -8px -10px 15px rgba(120,70,0,0.25),
        inset 8px 8px 12px rgba(255,255,255,0.7),
        0 0 15px #ffd700,
        0 0 30px rgba(255,215,0,0.8),
        0 6px 18px rgba(0,0,0,0.35);

    animation:
        goldenPulse 0.8s ease-in-out infinite alternate,
        goldenRotate 2s ease-in-out infinite;
}

@keyframes goldenPulse {
    from {
        transform: scale(1);
        filter: brightness(1);
    }

    to {
        transform: scale(1.12);
        filter: brightness(1.3);
    }
}

@keyframes goldenRotate {
    0% {
        box-shadow:
            0 0 15px #ffd700,
            0 0 25px rgba(255,215,0,0.7);
    }

    50% {
        box-shadow:
            0 0 25px #fff200,
            0 0 45px rgba(255,215,0,1);
    }

    100% {
        box-shadow:
            0 0 15px #ffd700,
            0 0 25px rgba(255,215,0,0.7);
    }
}
@keyframes ballFloat {
    from {
        transform: translateY(0) rotate(-3deg) scale(1);
    }

    to {
        transform: translateY(-5px) rotate(3deg) scale(1.05);
    }
}
#startScreen,
#gameOver {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.55);
    z-index: 20;
    text-align: center;
}

h1 {
    font-size: 48px;
    margin-bottom: 15px;
}

button {
    border: none;
    padding: 15px 35px;
    border-radius: 30px;
    font-size: 20px;
    font-weight: bold;
    background: white;
    color: #1e3a8a;
    cursor: pointer;
}

#gameOver {
    display: none;
}

#finalScore {
    font-size: 28px;
    margin: 15px 0 25px;
}
</style>
</head>

<body>

<div id="game">

    <div id="top">
        <div>⭐ Очки: <span id="score">0</span></div>
        <div>❤️ Жизни: <span id="lives">3</span></div>
    </div>

    <div id="startScreen">
        <h1>🎈 POP BALLS</h1>
        <p style="margin-bottom:25px;">Лопай падающие шарики!</p>
        <button onclick="startGame()">ИГРАТЬ</button>
    </div>

    <div id="gameOver">
        <h1>💥 ИГРА ОКОНЧЕНА</h1>
        <div id="finalScore">Очки: 0</div>
        <button onclick="startGame()">ЕЩЁ РАЗ</button>
    </div>

</div>

<script>

let score = 0;
let lives = 3;
let gameRunning = false;
let spawnTimer;
let difficultyTimer;

const game = document.getElementById("game");
const scoreElement = document.getElementById("score");
const livesElement = document.getElementById("lives");
const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");

let fallSpeed = 2;

function startGame() {

    document.querySelectorAll(".ball").forEach(ball => ball.remove());

    score = 0;
    lives = 3;
    fallSpeed = 2;
    gameRunning = true;

    scoreElement.textContent = score;
    livesElement.textContent = lives;

    startScreen.style.display = "none";
    gameOverScreen.style.display = "none";

    clearInterval(spawnTimer);
    clearInterval(difficultyTimer);

    spawnTimer = setInterval(createBall, 700);

    difficultyTimer = setInterval(() => {
        fallSpeed += 0.25;
    }, 5000);
}

function createBall() {

    if (!gameRunning) return;

    const ball = document.createElement("div");
    ball.classList.add("ball");
    const isGolden = Math.random() < 0.12;

if (isGolden) {
    ball.classList.add("golden");
    ball.textContent = "огъуй";

    ball.style.display = "flex";
    ball.style.alignItems = "center";
    ball.style.justifyContent = "center";
    ball.style.fontSize = "12px";
    ball.style.fontWeight = "bold";
    ball.style.color = "#5c3b00";
    ball.style.textShadow = "0 1px 2px rgba(255,255,255,0.5)";
}

    const colors = [
        "#ff4757",
        "#2ed573",
        "#1e90ff",
        "#ffa502",
        "#e056fd",
        "#00d2d3"
    ];

    const color = colors[Math.floor(Math.random() * colors.length)];

ball.style.setProperty("--ball-color", color);

const lightColors = [
    "#ff9ff3",
    "#7efff5",
    "#ffeaa7",
    "#a29bfe",
    "#81ecec",
    "#fab1a0"
];

const darkColors = [
    "#c0392b",
    "#00a884",
    "#e67e22",
    "#6c5ce7",
    "#0984e3",
    "#d63031"
];

ball.style.setProperty(
    "--ball-light",
    lightColors[Math.floor(Math.random() * lightColors.length)]
);

ball.style.setProperty(
    "--ball-dark",
    darkColors[Math.floor(Math.random() * darkColors.length)]
);

ball.style.setProperty("--ball-glow", color);
    const maxX = window.innerWidth - 60;

    ball.style.left = Math.random() * maxX + "px";
    ball.style.top = "-70px";

    game.appendChild(ball);

    let y = -70;

    const fall = setInterval(() => {

        if (!gameRunning) {
            clearInterval(fall);
            ball.remove();
            return;
        }

        y += fallSpeed;
        ball.style.top = y + "px";

        if (y > window.innerHeight) {

            clearInterval(fall);
            ball.remove();

            lives--;
            livesElement.textContent = lives;

            if (lives <= 0) {
                endGame();
            }
        }

    }, 16);

    ball.addEventListener("pointerdown", () => {

        if (!gameRunning) return;

        clearInterval(fall);

const isGolden = ball.classList.contains("golden");

const points = isGolden ? 5 : 1;

score += points;
scoreElement.textContent = score;
const popText = document.createElement("div");

popText.textContent = "+" + points;

popText.style.position = "fixed";
popText.style.left = (ball.getBoundingClientRect().left + 20) + "px";
popText.style.top = (ball.getBoundingClientRect().top - 5) + "px";

popText.style.color = "white";
popText.style.fontSize = "24px";
popText.style.fontWeight = "bold";
popText.style.textShadow = "0 2px 8px rgba(0,0,0,0.5)";
popText.style.pointerEvents = "none";
popText.style.zIndex = "100";

document.body.appendChild(popText);

popText.animate(
    [
        {
            transform: "translateY(0) scale(0.7)",
            opacity: 1
        },
        {
            transform: "translateY(-45px) scale(1.2)",
            opacity: 0
        }
    ],
    {
        duration: 600,
        easing: "ease-out"
    }
);

setTimeout(() => popText.remove(), 650);

const rect = ball.getBoundingClientRect();
const centerX = rect.left + rect.width / 2;
const centerY = rect.top + rect.height / 2;

for (let i = 0; i < 12; i++) {

    const particle = document.createElement("div");

    particle.style.position = "fixed";
    particle.style.left = centerX + "px";
    particle.style.top = centerY + "px";
    particle.style.width = "7px";
    particle.style.height = "7px";
    particle.style.borderRadius = "50%";
    particle.style.background = ball.style.getPropertyValue("--ball-color");
    particle.style.boxShadow =
        "0 0 8px " +
        ball.style.getPropertyValue("--ball-color");

    particle.style.pointerEvents = "none";
    particle.style.zIndex = "50";

    document.body.appendChild(particle);

    const angle = Math.random() * Math.PI * 2;
    const distance = 35 + Math.random() * 55;

    const x = Math.cos(angle) * distance;
    const y = Math.sin(angle) * distance;

    particle.animate(
        [
            {
                transform: "translate(-50%, -50%) scale(1)",
                opacity: 1
            },
            {
                transform:
                    `translate(${x}px, ${y}px) scale(0)`,
                opacity: 0
            }
        ],
        {
            duration: 450 + Math.random() * 250,
            easing: "cubic-bezier(.2,.8,.3,1)"
        }
    );

    setTimeout(() => particle.remove(), 800);
}

ball.animate(
    [
        { transform: "scale(1)", opacity: 1 },
        { transform: "scale(1.8)", opacity: 0 }
    ],
    {
        duration: 180,
        easing: "ease-out"
    }
);

setTimeout(() => ball.remove(), 200);
    });
}

function endGame() {

    gameRunning = false;

    clearInterval(spawnTimer);
    clearInterval(difficultyTimer);

    document.querySelectorAll(".ball").forEach(ball => ball.remove());

    finalScore.textContent = "Очки: " + score;

    gameOverScreen.style.display = "flex";
}

</script>

</body>
</html>

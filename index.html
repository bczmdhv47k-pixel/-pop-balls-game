<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pop Balls 🎈</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #111827, #1e3a8a);
    color: white;
    height: 100vh;
}

#game {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

#top {
    position: absolute;
    top: 15px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-around;
    z-index: 10;
    font-size: 20px;
    font-weight: bold;
}

.ball {
    position: absolute;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    cursor: pointer;
    box-shadow:
        inset -8px -8px 15px rgba(0,0,0,0.2),
        inset 8px 8px 15px rgba(255,255,255,0.35),
        0 5px 15px rgba(0,0,0,0.3);
}

#startScreen,
#gameOver {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.55);
    z-index: 20;
    text-align: center;
}

h1 {
    font-size: 48px;
    margin-bottom: 15px;
}

button {
    border: none;
    padding: 15px 35px;
    border-radius: 30px;
    font-size: 20px;
    font-weight: bold;
    background: white;
    color: #1e3a8a;
    cursor: pointer;
}

#gameOver {
    display: none;
}

#finalScore {
    font-size: 28px;
    margin: 15px 0 25px;
}
</style>
</head>

<body>

<div id="game">

    <div id="top">
        <div>⭐ Очки: <span id="score">0</span></div>
        <div>❤️ Жизни: <span id="lives">3</span></div>
    </div>

    <div id="startScreen">
        <h1>🎈 POP BALLS</h1>
        <p style="margin-bottom:25px;">Лопай падающие шарики!</p>
        <button onclick="startGame()">ИГРАТЬ</button>
    </div>

    <div id="gameOver">
        <h1>💥 ИГРА ОКОНЧЕНА</h1>
        <div id="finalScore">Очки: 0</div>
        <button onclick="startGame()">ЕЩЁ РАЗ</button>
    </div>

</div>

<script>

let score = 0;
let lives = 3;
let gameRunning = false;
let spawnTimer;
let difficultyTimer;

const game = document.getElementById("game");
const scoreElement = document.getElementById("score");
const livesElement = document.getElementById("lives");
const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");

let fallSpeed = 2;

function startGame() {

    document.querySelectorAll(".ball").forEach(ball => ball.remove());

    score = 0;
    lives = 3;
    fallSpeed = 2;
    gameRunning = true;

    scoreElement.textContent = score;
    livesElement.textContent = lives;

    startScreen.style.display = "none";
    gameOverScreen.style.display = "none";

    clearInterval(spawnTimer);
    clearInterval(difficultyTimer);

    spawnTimer = setInterval(createBall, 700);

    difficultyTimer = setInterval(() => {
        fallSpeed += 0.25;
    }, 5000);
}

function createBall() {

    if (!gameRunning) return;

    const ball = document.createElement("div");
    ball.classList.add("ball");

    const colors = [
        "#ff4757",
        "#2ed573",
        "#1e90ff",
        "#ffa502",
        "#e056fd",
        "#00d2d3"
    ];

    ball.style.background =
        colors[Math.floor(Math.random() * colors.length)];

    const maxX = window.innerWidth - 60;

    ball.style.left = Math.random() * maxX + "px";
    ball.style.top = "-70px";

    game.appendChild(ball);

    let y = -70;

    const fall = setInterval(() => {

        if (!gameRunning) {
            clearInterval(fall);
            ball.remove();
            return;
        }

        y += fallSpeed;
        ball.style.top = y + "px";

        if (y > window.innerHeight) {

            clearInterval(fall);
            ball.remove();

            lives--;
            livesElement.textContent = lives;

            if (lives <= 0) {
                endGame();
            }
        }

    }, 16);

    ball.addEventListener("pointerdown", () => {

        if (!gameRunning) return;

        clearInterval(fall);

        score++;
        scoreElement.textContent = score;

        ball.style.transform = "scale(1.7)";
        ball.style.opacity = "0";

        setTimeout(() => ball.remove(), 100);
    });
}

function endGame() {

    gameRunning = false;

    clearInterval(spawnTimer);
    clearInterval(difficultyTimer);

    document.querySelectorAll(".ball").forEach(ball => ball.remove());

    finalScore.textContent = "Очки: " + score;

    gameOverScreen.style.display = "flex";
}

</script>

</body>
</html>
